[theme]
base = "light"
primaryColor = "#2E86AB"
backgroundColor = "#F0F4F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A2B4A"
font = "sans serif"

[theme.sidebar]
widgetBackgroundColor = "#243B55"
widgetBorderColor = "#2E86AB"
backgroundColor = "#1A2B4A"
secondaryBackgroundColor = "#1e3352"
textColor = "#FFFFFF"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
# URL amigável no PC: http://localhost:8501 (evita IP 192.168.x.x)
address = "localhost"

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501
